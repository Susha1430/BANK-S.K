<!DOCTYPE html>
<html>
<head>
<title>ATM System</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:15px;
  width:330px;
}

input,button{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  background:#00c6ff;
  color:#fff;
  font-weight:bold;
}

#statement{
  margin-top:10px;
  font-size:13px;
  max-height:120px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="box">

<h2>ATM System</h2>

<input id="card" placeholder="Card Number">
<input id="pin" placeholder="PIN">

<button onclick="checkBalance()">Check Balance</button>
<button onclick="showStatement()">Mini Statement</button>

<p id="msg"></p>

<div id="statement"></div>

</div>

<script>

function getATM(){return JSON.parse(localStorage.getItem("sk_atm_cards"))||[];}
function getUsers(){return JSON.parse(localStorage.getItem("sk_bank_users"))||[];}

let msg = document.getElementById("msg");

function findCard(){
  let card=document.getElementById("card").value.trim();
  let pin=document.getElementById("pin").value.trim();

  let cards=getATM();
  let c=cards.find(x=>x.cardNumber===card && x.pin===pin);

  if(!c){
    msg.innerText="❌ Invalid Card/PIN";
    return null;
  }

  if(c.status!=="Active"){
    msg.innerText="⚠ Card not active";
    return null;
  }

  return c;
}

function checkBalance(){

  let c=findCard();
  if(!c) return;

  let users=getUsers();
  let u=users.find(x=>x.accountNumber===c.accountNumber);

  msg.innerText="💳 Balance: ₹"+u.balance;
}

function showStatement(){

  let c=findCard();
  if(!c) return;

  let users=getUsers();
  let u=users.find(x=>x.accountNumber===c.accountNumber);

  let list = (u.transactions || []).slice(-5).reverse();

  let html="<h4>Last 5 Transactions</h4>";

  if(list.length === 0){
    html += "<p>No transactions found</p>";
  } else {
    list.forEach(t=>{
      html += "<p>"+t+"</p>";
    });
  }

  document.getElementById("statement").innerHTML = html;
}

</script>

</body>
</html>
