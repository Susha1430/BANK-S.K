<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set ATM PIN</title>

<style>
body{
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.container{
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:15px;
  width:320px;
  backdrop-filter:blur(10px);
  text-align:center;
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1;}
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00c6ff;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

#msg{
  margin-top:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Set ATM PIN</h2>

  <input type="text" id="card" placeholder="Enter Card Number">
  <input type="password" id="pin" placeholder="Enter 4 Digit PIN">

  <button onclick="setPin()">Set PIN</button>

  <p id="msg"></p>
</div>

<script>

// Get ATM data
function getATM(){
  return JSON.parse(localStorage.getItem("sk_atm_cards")) || [];
}

// Save ATM data
function saveATM(data){
  localStorage.setItem("sk_atm_cards", JSON.stringify(data));
}

// Set PIN function (FIXED)
function setPin(){

  let cards = getATM();

  // ✅ FIXED VARIABLE NAMES
  let cardNumber = document.getElementById("card").value.trim();
  let pin = document.getElementById("pin").value.trim();

  let msg = document.getElementById("msg");

  // Find card
  let obj = cards.find(x => x.cardNumber === cardNumber);

  if(!obj){
    msg.innerText = "❌ Card not found";
    msg.style.color = "red";
    return;
  }

  if(obj.status !== "Active"){
    msg.innerText = "⚠ Card not activated";
    msg.style.color = "orange";
    return;
  }

  if(!/^[0-9]{4}$/.test(pin)){
    msg.innerText = "❌ PIN must be 4 digits";
    msg.style.color = "red";
    return;
  }

  // Save PIN
  obj.pin = pin;
  saveATM(cards);

  msg.innerText = "✅ PIN Set Successfully";
  msg.style.color = "lightgreen";

  // Clear inputs
  document.getElementById("card").value = "";
  document.getElementById("pin").value = "";
}

</script>

</body>
</html>
