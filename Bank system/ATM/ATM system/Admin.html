<!DOCTYPE html>
<html>
<body>

<h2>Admin Login</h2>

<input id="u" placeholder="Username"><br><br>
<input id="p" placeholder="Password"><br><br>

<button onclick="login()">Login</button>
<p id="msg"></p>

<script>
function login(){
if(u.value==="admin" && p.value==="1234"){
  localStorage.setItem("admin","true");
  location="Atm card panel.html";
}else{
  msg.innerText="Wrong";
}
}
</script>

</body>
</html>
