<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K Bank Entry</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* BODY */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
overflow:hidden;
}

/* MAIN */
.container{
text-align:center;
}

/* TITLE */
.title{
font-size:56px;
font-weight:bold;
background:linear-gradient(90deg,#ffd700,#ff9800,#00c6ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 3s infinite linear;
}

/* SUBTITLE */
.subtitle{
margin-bottom:30px;
opacity:0.8;
font-size:18px;
}

/* BUTTON */
.btn{
display:block;
width:280px;
margin:12px auto;
padding:15px;
border:none;
border-radius:50px;
font-size:17px;
color:white;
cursor:pointer;
transition:0.4s;
position:relative;
overflow:hidden;
background:linear-gradient(90deg,#00c6ff,#0072ff);
box-shadow:0 0 15px rgba(0,198,255,0.5);
}

/* HOVER ANIMATION */
.btn:hover{
transform:translateY(-4px) scale(1.05);
box-shadow:0 0 30px #00c6ff;
}

/* SHINE EFFECT */
.btn::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.5),transparent);
transition:0.6s;
}

.btn:hover::before{
left:100%;
}

/* DIFFERENT COLORS */
.btn.login{
background:linear-gradient(90deg,#4facfe,#00f2fe);
}

.btn.apply{
background:linear-gradient(90deg,#43e97b,#38f9d7);
}

.btn.atm{
background:linear-gradient(90deg,#ff9800,#ff5722);
}

.btn.download{
background:linear-gradient(90deg,#00ff9d,#00c853);
}

/* CLICK EFFECT */
.btn:active{
transform:scale(0.92);
}

/* LOADER */
.loader{
margin-top:25px;
display:none;
}

.loadingBox{
width:300px;
height:12px;
background:rgba(255,255,255,0.15);
border-radius:20px;
overflow:hidden;
margin:auto;
box-shadow:0 0 10px rgba(255,255,255,0.2);
}

.bar{
height:12px;
width:0;
background:linear-gradient(90deg,#ffd700,#ff9800,#00c6ff,#00ff9d);
border-radius:20px;
animation:load 2.5s forwards;
}

.loadingText{
margin-top:12px;
font-size:14px;
letter-spacing:1px;
animation:fadeText 1s infinite alternate;
}

/* ANIMATIONS */
@keyframes load{
from{width:0}
to{width:100%}
}

@keyframes fadeText{
from{opacity:0.4}
to{opacity:1}
}

@keyframes shine{
0%{background-position:0%}
100%{background-position:200%}
}

</style>
</head>

<body>

<div class="container">

<div class="title">S.K BANK</div>
<div class="subtitle">Your Trust, Our Priority</div>

<!-- BUTTONS -->
<button class="btn login" onclick="start('login')">🔐 Login</button>
<button class="btn apply" onclick="start('apply')">💳 ATM Card Registration</button>
<button class="btn atm" onclick="start('atm')">🏧 ATM Panel</button>
<button class="btn download" onclick="start('download')">📥 ATM Download</button>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="loadingBox">
    <div class="bar"></div>
  </div>
  <div class="loadingText" id="loadingText">
    Initializing Secure Banking...
  </div>
</div>

</div>

<!-- SOUND -->
<audio id="introSound">
<source src="sound/sub.mp3" type="audio/mpeg">
</audio>

<script>

function start(type){

  let sound = document.getElementById("introSound");
  sound.currentTime = 0;
  sound.play().catch(()=>{});

  document.getElementById("loader").style.display="block";

  document.querySelectorAll(".btn").forEach(b=>{
    b.style.display="none";
  });

  let text = document.getElementById("loadingText");

  /* LOADING TEXT CHANGE */
  if(type==="login"){
    text.innerText = "🔐 Loading Secure Login...";
  }
  else if(type==="apply"){
    text.innerText = "💳 Opening Registration System...";
  }
  else if(type==="atm"){
    text.innerText = "🏧 Starting ATM Panel...";
  }
  else if(type==="download"){
    text.innerText = "📥 Preparing ATM Download...";
  }

  /* REDIRECT */
  setTimeout(()=>{

    if(type==="login"){
      window.location.href="login.html";
    }
    else if(type==="apply"){
      window.location.href="registration atm.html";
    }
    else if(type==="atm"){
      window.location.href="ATM system/panel.html";
    }
    else if(type==="download"){
      window.location.href="ATM system/atm card download.html";
    }

  },2500);

}

</script>

</body>
</html>
