<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K Bank Entry</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
overflow:hidden;
}

.container{
text-align:center;
}

.title{
font-size:52px;
color:#ffd700;
text-shadow:0 0 15px #ffd700,0 0 35px #ffae00;
margin-bottom:10px;
animation:glow 2s infinite alternate;
}

.subtitle{
margin-bottom:30px;
font-size:18px;
opacity:0.8;
}

/* buttons */
.btn{
display:block;
width:260px;
margin:12px auto;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#00c6ff,#0072ff);
color:white;
font-size:17px;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 10px rgba(0,198,255,0.5);
}

.btn:hover{
transform:translateY(-3px) scale(1.03);
box-shadow:0 0 25px #00c6ff;
}

/* ATM panel */
.btn.atm{
background:linear-gradient(90deg,#ff9800,#ff3d00);
}

/* ATM download special */
.btn.download{
background:linear-gradient(90deg,#00ff9d,#00c853);
box-shadow:0 0 10px rgba(0,255,157,0.6);
}

.btn.download:hover{
box-shadow:0 0 25px #00ff9d;
}

/* loader */
.loader{
margin-top:25px;
display:none;
}

.loadingBox{
width:280px;
height:10px;
background:rgba(255,255,255,0.2);
border-radius:20px;
margin:auto;
overflow:hidden;
}

.bar{
width:0;
height:10px;
background:linear-gradient(90deg,#ffd700,#00c6ff,#00ff9d);
border-radius:20px;
animation:load 2.5s forwards;
}

.loadingText{
margin-top:12px;
font-size:14px;
letter-spacing:1px;
}

/* animations */
@keyframes load{
from{width:0}
to{width:100%}
}

@keyframes glow{
from{ text-shadow:0 0 10px #ffd700; }
to{ text-shadow:0 0 35px #ff9800; }
}

.btn:active{
transform:scale(0.95);
}

</style>
</head>

<body>

<div class="container">

<div class="title">S.K BANK</div>
<div class="subtitle">Your Trust, Our Priority</div>

<!-- BUTTONS -->
<button class="btn" onclick="start('login')">🔐 Login</button>
<button class="btn" onclick="start('apply')">💳 ATM Card Registration</button>
<button class="btn atm" onclick="start('atm')">🏧 ATM Panel</button>
<button class="btn download" onclick="start('download')">📥 ATM Download</button>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="loadingBox">
    <div class="bar"></div>
  </div>
  <div class="loadingText" id="loadingText">
    Starting Secure Banking System...
  </div>
</div>

</div>

<!-- SOUND -->
<audio id="introSound" preload="auto">
<source src="sound/sub.mp3" type="audio/mpeg">
</audio>

<script>

function start(type){

  let sound = document.getElementById("introSound");
  sound.currentTime = 0;
  sound.play().catch(()=>{});

  document.getElementById("loader").style.display="block";
  document.querySelectorAll(".btn").forEach(b=>b.style.display="none");

  let text = document.getElementById("loadingText");

  if(type==="login"){
    text.innerText = "🔐 Opening Secure Login...";
  }
  else if(type==="apply"){
    text.innerText = "💳 Opening ATM Registration...";
  }
  else if(type==="atm"){
    text.innerText = "🏧 Loading ATM Panel...";
  }
  else if(type==="download"){
    text.innerText = "📥 Opening ATM Card Download...";
  }

  setTimeout(()=>{

    if(type==="login"){
      window.location.href="login.html";
    }
    else if(type==="apply"){
      window.location.href="registration atm.html";
    }
    else if(type==="atm"){
      window.location.href="ATM system/panel.html";
    }
    else if(type==="download"){
      window.location.href="ATM system/atm card download.html";  // 🔥 your download page
    }

  },2500);
}

</script>

</body>
</html>
