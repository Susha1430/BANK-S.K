<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM Card Registration</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:#fff;
}

.container{
  width:350px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  animation:fadeUp 0.6s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;}
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
}

input,select{
  background:#fff;
  color:#000;
}

button{
  background:linear-gradient(90deg,#00c6ff,#0072ff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,114,255,0.4);
}

.msg{
  text-align:center;
  margin-top:10px;
  font-size:14px;
}

.success{color:#00ffae;}
.error{color:#ff6b6b;}
</style>
</head>

<body>

<div class="container">
  <h2>ATM Card Registration</h2>

  <input type="text" id="accountNumber" placeholder="Enter Bank Account Number">

  <select id="cardType">
    <option value="">Select Card Type</option>
    <option value="normal">Normal Card (₹250)</option>
    <option value="vip">VIP Card (₹2000)</option>
  </select>

  <button onclick="applyATM()">Apply ATM Card</button>

  <div id="msg" class="msg"></div>
</div>

<script>

// USERS (existing)
function getUsers(){
  return JSON.parse(localStorage.getItem("sk_bank_users")) || [];
}
function saveUsers(data){
  localStorage.setItem("sk_bank_users", JSON.stringify(data));
}

// ATM STORAGE
function getATM(){
  return JSON.parse(localStorage.getItem("sk_bank_atm")) || [];
}
function saveATM(data){
  localStorage.setItem("sk_bank_atm", JSON.stringify(data));
}

// GENERATE ATM NUMBER
function generateATM(){
  let num="";
  for(let i=0;i<16;i++){
    num+=Math.floor(Math.random()*10);
  }
  return num;
}

// APPLY ATM
function applyATM(){

  let acc=document.getElementById("accountNumber").value.trim();
  let type=document.getElementById("cardType").value;
  let msg=document.getElementById("msg");

  let users=getUsers();
  let atm=getATM();

  let user=users.find(u=>u.accountNumber===acc);

  if(!user){
    msg.innerText="Account not found";
    msg.className="msg error";
    return;
  }

  // ONE TIME CHECK
  let already=atm.find(a=>a.accountNumber===acc);

  if(already){
    msg.innerText="ATM already registered (one time only)";
    msg.className="msg error";
    return;
  }

  let charge = type==="vip" ? 2000 : 250;

  if(!type){
    msg.innerText="Select card type";
    msg.className="msg error";
    return;
  }

  if(user.balance < charge){
    msg.innerText="Insufficient balance";
    msg.className="msg error";
    return;
  }

  // DEDUCT BALANCE
  user.balance -= charge;

  // CREATE ATM
  let atmData={
    accountNumber:acc,
    name:user.fullName,
    atmNumber:generateATM(),
    type:type,
    status:"pending",
    pin:null
  };

  atm.push(atmData);

  saveATM(atm);
  saveUsers(users);

  msg.innerText="ATM Card Applied Successfully (Pending Approval)";
  msg.className="msg success";

  // animation reset
  document.querySelector(".container").style.transform="scale(0.97)";
  setTimeout(()=>{
    document.querySelector(".container").style.transform="scale(1)";
  },150);
}

</script>

</body>
</html>
