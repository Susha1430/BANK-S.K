<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>S.K Bank ATM Card Download</title>

<!-- LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#d9d9ef,#cfd5f7);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:700px;
  background:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

h1{text-align:center;color:#1f2d5a;}
.sub{text-align:center;margin-bottom:20px;color:#555;}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  margin-top:10px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.search-btn{background:#5b6cff;color:#fff;}
.pdf-btn{background:#ff5f6d;color:#fff;}
.print-btn{background:#00b09b;color:#fff;}

.message{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  text-align:center;
  display:none;
}
.success{background:#e7fff1;color:#127a3f;}
.error{background:#fff0f0;color:#c53131;}

.card-wrapper{display:none;margin-top:20px;}

/* CARD DESIGN */
.atm-card{
  width:100%;
  max-width:420px;
  height:250px;
  margin:auto;
  border-radius:20px;
  padding:20px;
  color:#fff;
  position:relative;
  background:linear-gradient(135deg,#37005d,#ff2476);
  box-shadow:0 15px 30px rgba(0,0,0,0.3);
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(0.9);}
  to{opacity:1;}
}

.bank{font-size:22px;font-weight:bold;}

.card-number{
  position:absolute;
  bottom:70px;
  font-size:20px;
  letter-spacing:2px;
}

.name{
  position:absolute;
  bottom:30px;
  font-size:16px;
}

.valid{
  position:absolute;
  right:20px;
  bottom:30px;
  font-size:14px;
}

/* Hover effect */
.atm-card:hover{
  transform:scale(1.03);
  transition:0.3s;
}
</style>
</head>

<body>

<div class="container">

<h1>S.K Bank</h1>
<p class="sub">ATM Card Download & Print</p>

<input id="cardInput" placeholder="Enter 16 digit ATM card number">
<button class="search-btn" onclick="searchCard()">Show Card</button>

<div id="msg" class="message"></div>

<div id="cardWrapper" class="card-wrapper">

  <div id="cardUI" class="atm-card">
    <div class="bank">S.K BANK</div>
    <div id="cardNum" class="card-number"></div>
    <div id="cardName" class="name"></div>
    <div id="cardValid" class="valid"></div>
  </div>

  <button class="pdf-btn" onclick="downloadPDF()">Download PDF</button>
  <button class="print-btn" onclick="printCard()">Print Card</button>

</div>

</div>

<script>

// STORAGE FUNCTIONS
function getCards(){
  return JSON.parse(localStorage.getItem("sk_atm_cards")) || [];
}

function getUsers(){
  return JSON.parse(localStorage.getItem("sk_bank_users")) || [];
}

// FORMAT CARD NUMBER
function formatNumber(num){
  return num.replace(/(.{4})/g,"$1 ").trim();
}

// MESSAGE
function showMsg(text,type){
  let msg=document.getElementById("msg");
  msg.style.display="block";
  msg.className="message "+type;
  msg.innerText=text;
}

// SEARCH CARD
function searchCard(){

  let input=document.getElementById("cardInput").value.replace(/\s/g,"");

  if(!/^\d{16}$/.test(input)){
    showMsg("Enter valid 16 digit card number","error");
    return;
  }

  let cards=getCards();
  let users=getUsers();

  let card=cards.find(c=>c.cardNumber===input && c.status==="Approved");

  if(!card){
    showMsg("Approved card not found","error");
    return;
  }

  let user=users.find(u=>u.accountNumber===card.accountNumber);

  document.getElementById("cardNum").innerText=formatNumber(card.cardNumber);
  document.getElementById("cardName").innerText=user ? (user.fullName || user.name) : "CARD HOLDER";
  document.getElementById("cardValid").innerText="VALID "+card.validThru;

  document.getElementById("cardWrapper").style.display="block";

  showMsg("Card Loaded Successfully","success");
}

// DOWNLOAD PDF
async function downloadPDF(){

  const { jsPDF } = window.jspdf;
  let card=document.getElementById("cardUI");

  let canvas=await html2canvas(card,{scale:3});
  let img=canvas.toDataURL("image/png");

  let pdf=new jsPDF("landscape","mm",[60,95]);
  pdf.addImage(img,"PNG",0,0,95,60);
  pdf.save("atm-card.pdf");
}

// PRINT
function printCard(){
  window.print();
}

</script>

</body>
</html>
